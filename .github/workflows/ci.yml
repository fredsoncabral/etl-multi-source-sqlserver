name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar unixODBC (necessário para importar pyodbc)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unixodbc
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar testes
        run: PYTHONPATH=src pytest -v
